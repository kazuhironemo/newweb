<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>暦情報</title>
    <style>
      body {
        
        justify-content: center ;
        margin: 0;
        padding: 0;
      }
      .holiday {
        color: #ff0000;
      }
      .saturday {
        color: #0000cc;
      }
      .weekday {
        color: #000000;
      }
      table {
        width: 80%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f4f4f4;
      }
    </style>
  </head>
  <body>
    <div>
      <h1><span id="area"></span> 暦</h1>
      <table id="dataTable">
        <thead>
          <tr>
            <th>日付</th>
            <th>曜日</th>
            <th>祝日</th>
            <th>六曜</th>
            <th>干支</th>
            <th>和暦</th>
            <th>旧暦</th>
            <th>24節気</th>
          </tr>
        </thead>
        <tbody>
          <!-- データがここに挿入されます -->
        </tbody>
      </table>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script>
      const api = "https://koyomi.zingsystem.com/api/";
      const param = {
        mode: "m",
        cnt: "12",
        targetyyyy: "2031",
        targetmm: "1", // 何月から
        targetdd: "1", // 何日から
      };

      
      $.ajax({
        url: api,
        type: "post",
        dataType: "json",
        data: param,
        cache: false,
        success: function (data) {
          console.log(data.datelist);
        
          const $tableBody = document.querySelector("#dataTable tbody"); // <tbody>を取得
          $tableBody.innerHTML = ""; // 既存の行をクリア

          let previousKyurekim = null; // ひとつ前の kyurekim を保持する変数
          
          
          
          // データをHTMLに挿入する関数
          let uru=0;
          let tuki=0;
          Object.keys(data.datelist).forEach((date) => {
            const item = data.datelist[date];
            
              // 現在の kyurekim を取得
            let currentKyurekim = item.kyurekim;

              // ひとつ前の値と比較して "閏" を付ける条件を追加
            if (item.kyurekid == 1 && previousKyurekim === currentKyurekim){
              uru=1;
              tuki=currentKyurekim;
            }

            if (uru == 1 && tuki === item.kyurekim) {
                item.kyurekim= '閏'+item.kyurekim;
            }
              
              // 現在の kyurekim を次のループのために保存
            previousKyurekim = item.kyurekim;

            const row = `
            <tr>
              <td>${date}</td>
              <td>${item.week}</td>
              <td class="${item.holiday ? "holiday" : ""}">${item.holiday || "なし"}</td>
              <td>${item.rokuyou}</td>
              <td>${item.eto}</td>
              <td>${item.gengo} ${item.wareki}年</td>
              <td>${item.kyurekiy}-${item.kyurekim}-${item.kyurekid}</td>
              <td>${item.sekki}</td>
            </tr>`
            $tableBody.insertAdjacentHTML("beforeend", row); // 行を追加
            
          });
        }
      });
    </script>
  </body>
</html>
